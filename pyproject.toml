[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contentforge"
version = "0.2.0"
description = "AI-powered content factory: topic discovery -> script writing -> video production -> multi-platform publishing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ContentForge Contributors" }]
keywords = ["content-automation", "ai", "video", "publishing", "rpa", "tiktok", "youtube"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "edge-tts>=6.1.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
contentforge = "contentforge.cli:main"

[tool.setuptools.packages.find]
include = ["contentforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "rpa: browser automation tests (skipped in CI by default)",
    "network: tests that hit live network endpoints",
    "integration: end-to-end pipeline tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["contentforge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
